bundle:
  name: gdpr-rag-pipeline

variables:
  catalog:
    default: accenture2026dbcks
  schema:
    default: team6
  bronze_table:
    default: gdpr_bronze_chunks
  silver_table:
    default: gdpr_silver_enriched_chunks
  gold_table:
    default: gdpr_gold_index_ready

targets:
  dev:
    mode: development
    default: true

resources:
  jobs:

    # Job 1: raw files from Volume -> Bronze chunks + Gold index-ready table.
    ingest_gdpr_chunks:
      name: "[dev] ingest_gdpr_bronze_chunks"
      tasks:
        - task_key: ingest
          spark_python_task:
            python_file: src/day_09/databricks/spark_ingester.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --bronze-table
              - ${var.bronze_table}
              - --gold-table
              - ${var.gold_table}
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - beautifulsoup4>=4.12.0
              - databricks-sdk>=0.20.0
              - pymupdf>=1.27.2.3
              - python-docx>=1.1.0
              - python-dotenv>=1.0.0

    # Job 2: Bronze chunks -> Silver enriched chunks with embedding column.
    # Run AFTER ingest_gdpr_chunks. Output feeds Vector Search setup.
    enrich_gdpr_chunks:
      name: "[dev] enrich_gdpr_silver_chunks"
      tasks:
        - task_key: enrich
          spark_python_task:
            python_file: src/day_09/databricks/enrichment_job.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --bronze-table
              - ${var.bronze_table}
              - --silver-table
              - ${var.silver_table}
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - beautifulsoup4>=4.12.0
              - databricks-sdk>=0.20.0
              - mlflow
              - pymupdf>=1.27.2.3
              - python-docx>=1.1.0
              - python-dotenv>=1.0.0
