bundle:
  name: gdpr-rag-pipeline

variables:
  catalog:
    default: main
  schema:
    default: rag
  table:
    default: gdpr_chunks

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${workspace.host}   # set via: databricks configure

resources:
  jobs:
    ingest_chunks:
      name: "[dev] ingest_chunks_to_delta"
      tasks:
        - task_key: ingest
          spark_python_task:
            python_file: src/day_09/databricks/spark_ingester.py
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            spark_env_vars:
              DELTA_CATALOG: ${var.catalog}
              DELTA_SCHEMA:  ${var.schema}
              DELTA_TABLE:   ${var.table}
