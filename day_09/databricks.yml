bundle:
  name: gdpr-rag-pipeline

variables:
  catalog:
    default: main
  schema:
    default: rag
  table:
    default: gdpr_chunks

targets:
  dev:
    mode: development
    default: true

resources:
  jobs:
    ingest_chunks:
      name: "[dev] ingest_chunks_to_delta"
      tasks:
        - task_key: ingest
          spark_python_task:
            python_file: src/day_09/databricks/spark_ingester.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table
              - ${var.table}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - beautifulsoup4>=4.12.0
              - databricks-sdk>=0.20.0
              - pymupdf>=1.27.2.3
              - python-docx>=1.1.0
              - python-dotenv>=1.0.0
