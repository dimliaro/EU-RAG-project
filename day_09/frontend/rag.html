<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corpus — Regulatory Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:              #080B14;
    --glass:           rgba(255,255,255,0.055);
    --glass-mid:       rgba(255,255,255,0.085);
    --glass-border:    rgba(255,255,255,0.10);
    --glass-border-hi: rgba(255,255,255,0.20);
    --blue:            #2997FF;
    --blue-dk:         #147CE5;
    --blue-glow:       rgba(41,151,255,0.28);
    --green:           #34D399;
    --amber:           #FBB040;
    --red:             #FF6B6B;
    --ink:             #F5F5F7;
    --ink-2:           #C7C7CC;
    --dim:             #8E8E93;
    --dim-2:           #545458;
    --radius:          18px;
    --radius-sm:       11px;
    --font:            'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono:            'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ─── Ambient background ──────────────────────────────────────────────────── */
  .bg-canvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(90px);
  }
  .orb-1 {
    width: 640px; height: 640px; top: -220px; right: -120px;
    background: radial-gradient(circle, rgba(41,151,255,0.13) 0%, transparent 70%);
  }
  .orb-2 {
    width: 480px; height: 480px; bottom: -160px; left: -120px;
    background: radial-gradient(circle, rgba(90,60,200,0.09) 0%, transparent 70%);
  }
  .orb-3 {
    width: 320px; height: 320px; top: 55%; left: 42%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(41,151,255,0.06) 0%, transparent 70%);
  }

  /* ─── Navigation ──────────────────────────────────────────────────────────── */
  .nav {
    position: sticky; top: 0; z-index: 200;
    background: rgba(8,11,20,0.72);
    backdrop-filter: blur(40px) saturate(160%);
    -webkit-backdrop-filter: blur(40px) saturate(160%);
    border-bottom: 1px solid var(--glass-border);
  }
  .nav-inner {
    max-width: 960px; margin: 0 auto; padding: 0 24px;
    height: 58px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }

  .brand { display: flex; align-items: center; gap: 11px; flex-shrink: 0; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(145deg, #2997FF 0%, #0058C8 100%);
    box-shadow: 0 0 18px rgba(41,151,255,0.45);
    position: relative; overflow: hidden;
  }
  .brand-mark::after {
    content: '';
    position: absolute; top: 3px; left: 3px; right: 3px; height: 40%;
    background: rgba(255,255,255,0.22);
    border-radius: 4px 4px 6px 6px;
  }
  .brand-name {
    font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: -0.4px;
  }
  .brand-sub {
    font-size: 12px; color: var(--dim); letter-spacing: 0.01em;
  }
  .brand-divider {
    width: 1px; height: 18px; background: var(--glass-border); margin: 0 2px;
  }
  @media (max-width: 560px) { .brand-sub, .brand-divider { display: none; } }

  .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .node-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.10em;
    text-transform: uppercase; color: var(--dim);
  }
  .node-input {
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--blue); font-family: var(--mono); font-size: 12px;
    padding: 7px 13px; border-radius: var(--radius-sm);
    outline: none; width: 228px; transition: border-color .2s, box-shadow .2s;
  }
  .node-input:focus {
    border-color: rgba(41,151,255,0.55);
    box-shadow: 0 0 0 3px rgba(41,151,255,0.13);
  }
  @media (max-width: 680px) { .node-label { display: none; } .node-input { width: 160px; } }

  /* ─── Layout ──────────────────────────────────────────────────────────────── */
  .main {
    position: relative; z-index: 1;
    max-width: 740px; margin: 0 auto;
    padding: 72px 24px 112px;
  }

  /* ─── Hero ────────────────────────────────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 52px; }
  .hero-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--blue);
    margin-bottom: 18px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .hero-eyebrow::before, .hero-eyebrow::after {
    content: ''; width: 28px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--blue));
  }
  .hero-eyebrow::after { background: linear-gradient(90deg, var(--blue), transparent); }

  .hero-title {
    font-size: clamp(52px, 11vw, 88px); font-weight: 600;
    letter-spacing: -3px; line-height: 0.95;
    background: linear-gradient(150deg, #FFFFFF 0%, #C7C7CC 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 22px;
  }
  .hero-sub {
    font-size: 16px; color: var(--dim); line-height: 1.65;
    max-width: 480px; margin: 0 auto; font-weight: 400;
  }

  /* ─── Glass surface ───────────────────────────────────────────────────────── */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(150%);
    -webkit-backdrop-filter: blur(40px) saturate(150%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
  }

  /* ─── Query card ──────────────────────────────────────────────────────────── */
  .query-card {
    padding: 22px 22px 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.08);
    transition: border-color .25s, box-shadow .25s;
  }
  .query-card:focus-within {
    border-color: rgba(41,151,255,0.45);
    box-shadow: 0 8px 40px rgba(0,0,0,0.35),
                0 0 0 4px rgba(41,151,255,0.10),
                inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .query-card textarea {
    display: block; width: 100%;
    background: transparent; border: none; outline: none;
    color: var(--ink); font-family: var(--font);
    font-size: 17px; font-weight: 400; line-height: 1.55;
    resize: none; min-height: 52px;
    caret-color: var(--blue);
  }
  .query-card textarea::placeholder { color: var(--dim-2); }
  .query-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--glass-border);
  }
  .shortcut-hint { font-size: 12px; color: var(--dim-2); }
  .shortcut-hint kbd {
    background: rgba(255,255,255,0.07); border: 1px solid var(--glass-border);
    border-radius: 5px; padding: 2px 7px;
    font-family: var(--font); font-size: 11px; color: var(--dim);
  }

  .btn-primary {
    background: var(--blue); color: #fff; border: none;
    border-radius: var(--radius-sm);
    padding: 10px 26px;
    font-family: var(--font); font-size: 14px; font-weight: 500;
    letter-spacing: -0.1px; cursor: pointer;
    transition: background .15s, transform .1s, box-shadow .2s;
    box-shadow: 0 4px 18px rgba(41,151,255,0.38);
  }
  .btn-primary:hover:not(:disabled) {
    background: #3DA5FF;
    box-shadow: 0 6px 26px rgba(41,151,255,0.52);
  }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary:disabled { background: var(--dim-2); box-shadow: none; cursor: not-allowed; }

  /* ─── Output ──────────────────────────────────────────────────────────────── */
  #out { margin-top: 44px; }

  /* ─── Loading ─────────────────────────────────────────────────────────────── */
  .progress-track {
    height: 2px; background: rgba(255,255,255,0.07);
    border-radius: 2px; overflow: hidden; margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    animation: sweep 1.5s ease-in-out infinite;
  }
  @keyframes sweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(400%)} }

  .steps { display: flex; flex-direction: column; gap: 9px; }
  .step {
    display: flex; align-items: center; gap: 13px;
    font-size: 13px; color: var(--dim-2); transition: color .3s;
  }
  .step-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim-2); flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .step.active { color: var(--ink-2); }
  .step.active .step-dot { background: var(--blue); box-shadow: 0 0 9px rgba(41,151,255,0.65); }
  .step.done { color: var(--dim); }
  .step.done .step-dot { background: rgba(41,151,255,0.35); }

  /* ─── Section labels ──────────────────────────────────────────────────────── */
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--dim);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-label .count { color: var(--blue); font-weight: 600; letter-spacing: 0; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }

  /* ─── Answer card ─────────────────────────────────────────────────────────── */
  .answer-section { margin-bottom: 36px; }
  .answer-card {
    padding: 28px 30px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.28),
                inset 0 1px 0 rgba(255,255,255,0.07);
    animation: rise .5s cubic-bezier(.16,1,.3,1) both;
  }
  .answer-text {
    font-size: 17px; line-height: 1.72; color: var(--ink);
    white-space: pre-wrap; word-break: break-word; font-weight: 400;
  }

  /* ─── Fragment cards ──────────────────────────────────────────────────────── */
  .fragments-grid { display: flex; flex-direction: column; gap: 10px; }

  .fragment {
    overflow: hidden;
    animation: rise .5s cubic-bezier(.16,1,.3,1) both;
    transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 2px 14px rgba(0,0,0,0.22);
  }
  .fragment:hover { border-color: var(--glass-border-hi); }

  .frag-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; cursor: pointer; user-select: none;
  }

  .frag-badge {
    font-size: 10px; font-weight: 600; letter-spacing: 0.10em;
    text-transform: uppercase; padding: 4px 11px;
    border-radius: 20px; flex-shrink: 0;
  }
  .frag-badge.article {
    background: rgba(52,211,153,0.12); color: var(--green);
    border: 1px solid rgba(52,211,153,0.22);
  }
  .frag-badge.recital {
    background: rgba(251,176,64,0.12); color: var(--amber);
    border: 1px solid rgba(251,176,64,0.22);
  }
  .frag-badge.generic {
    background: rgba(41,151,255,0.10); color: var(--blue);
    border: 1px solid rgba(41,151,255,0.18);
  }

  .frag-meta {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 500; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .frag-reg {
    font-size: 11px; color: var(--dim); flex-shrink: 0; font-family: var(--mono);
  }
  @media (max-width: 580px) { .frag-reg { display: none; } }

  .frag-score { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .frag-score-val { font-size: 11px; color: var(--dim-2); font-family: var(--mono); }
  .frag-bar {
    width: 44px; height: 3px; background: rgba(255,255,255,0.07);
    border-radius: 2px; overflow: hidden;
  }
  .frag-bar-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--blue-dk), var(--blue));
    border-radius: 2px; transition: width .9s cubic-bezier(.16,1,.3,1);
  }
  .frag-chevron {
    font-size: 9px; color: var(--dim-2); flex-shrink: 0;
    margin-left: 2px; transition: transform .25s;
  }
  .fragment.open .frag-chevron { transform: rotate(90deg); color: var(--blue); }

  .frag-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .fragment.open .frag-body { max-height: 420px; overflow-y: auto; }
  .frag-content {
    padding: 14px 18px 18px;
    border-top: 1px solid var(--glass-border);
    font-size: 13px; color: var(--dim); line-height: 1.68;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ─── Error ───────────────────────────────────────────────────────────────── */
  .error-card {
    padding: 20px 22px;
    background: rgba(255,59,48,0.07); border: 1px solid rgba(255,59,48,0.22);
    border-radius: var(--radius);
    font-size: 14px; color: var(--red); line-height: 1.65;
    animation: rise .4s ease both;
  }
  .error-card strong {
    display: block; margin-bottom: 6px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #FF4545;
  }

  /* ─── Status bar ──────────────────────────────────────────────────────────── */
  .status-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: rgba(8,11,20,0.80); backdrop-filter: blur(24px);
    border-top: 1px solid var(--glass-border);
    padding: 10px 28px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--dim-2); letter-spacing: 0.05em;
  }
  .status-live { display: flex; align-items: center; gap: 8px; color: var(--green); }
  .status-live::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 7px rgba(52,211,153,0.65);
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }

  /* ─── Animations ──────────────────────────────────────────────────────────── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── Scrollbar ───────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
  ::selection { background: rgba(41,151,255,0.32); color: var(--ink); }
</style>
</head>
<body>

<!-- Ambient depth -->
<div class="bg-canvas" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Navigation -->
<nav class="nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="brand-mark"></div>
      <span class="brand-name">Corpus</span>
      <span class="brand-divider"></span>
      <span class="brand-sub">Regulatory Intelligence</span>
    </div>
    <div class="nav-right">
      <span class="node-label">Node</span>
      <input class="node-input" id="base" type="text" value="http://127.0.0.1:8080"
             spellcheck="false" aria-label="API endpoint">
    </div>
  </div>
</nav>

<!-- Content -->
<main class="main">

  <!-- Hero -->
  <section class="hero">
    <p class="hero-eyebrow">Regulatory Intelligence</p>
    <h1 class="hero-title">Corpus</h1>
    <p class="hero-sub">Query EU regulations and compliance frameworks. Get grounded, citable answers from GDPR, DORA, and your entire document corpus.</p>
  </section>

  <!-- Query input -->
  <div class="query-card glass">
    <textarea id="q" rows="2" placeholder="Ask a question about your regulatory documents…" aria-label="Query"></textarea>
    <div class="query-footer">
      <span class="shortcut-hint"><kbd>⌘</kbd> <kbd>Return</kbd> to search</span>
      <button class="btn-primary" id="send">Search</button>
    </div>
  </div>

  <!-- Results -->
  <section id="out"></section>

</main>

<!-- Status bar -->
<div class="status-bar">
  <span class="status-live">System nominal</span>
  <span id="stamp">Awaiting query</span>
</div>

<script>
(function () {
  const qEl    = document.getElementById('q');
  const sendEl = document.getElementById('send');
  const baseEl = document.getElementById('base');
  const outEl  = document.getElementById('out');
  const stamp  = document.getElementById('stamp');

  /* Auto-grow textarea */
  function grow() { qEl.style.height = 'auto'; qEl.style.height = Math.min(qEl.scrollHeight, 240) + 'px'; }
  qEl.addEventListener('input', grow);

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* ── Loading phases ── */
  const PHASES = [
    'Embedding query vector',
    'Sweeping vector store',
    'Ranking nearest passages',
    'Synthesising response',
  ];
  let phaseTimer = null;

  function startLoader() {
    sendEl.disabled = true;
    sendEl.textContent = 'Searching…';
    stamp.textContent = 'Query in flight';

    let html = '<div><div class="progress-track"><div class="progress-fill"></div></div><div class="steps">';
    PHASES.forEach((p, i) => {
      html += `<div class="step" data-i="${i}"><div class="step-dot"></div><span>${esc(p)}</span></div>`;
    });
    outEl.innerHTML = html + '</div></div>';

    const steps = [...outEl.querySelectorAll('.step')];
    let i = 0;
    const advance = () => {
      steps.forEach((s, k) => {
        s.classList.toggle('active', k === i);
        if (k < i) s.classList.add('done'); else s.classList.remove('done');
      });
      i = (i + 1) % steps.length;
    };
    advance();
    phaseTimer = setInterval(advance, 760);
  }

  function stopLoader() {
    if (phaseTimer) { clearInterval(phaseTimer); phaseTimer = null; }
    sendEl.disabled = false;
    sendEl.textContent = 'Search';
  }

  /* ── Fragment badge ── */
  function badgeInfo(meta) {
    const st  = meta?.structure_type ?? '';
    const num = meta?.number;
    if (st === 'article') return { cls: 'article', label: num ? `Article ${num}` : 'Article' };
    if (st === 'recital') return { cls: 'recital', label: num ? `Recital ${num}` : 'Recital' };
    return { cls: 'generic', label: 'Source' };
  }

  function renderFragment(chunk, i) {
    const meta    = (chunk && typeof chunk === 'object') ? (chunk.metadata || {}) : {};
    const content = chunk?.content ?? chunk?.text ?? chunk?.page_content ?? String(chunk ?? '');
    const { cls, label } = badgeInfo(meta);

    const parts = [meta.title, meta.chapter].filter(Boolean);
    if (!parts.length && meta.source_file) parts.push(meta.source_file.split(/[\\/]/).pop());
    const metaLine = parts.join(' · ');

    const reg  = meta.regulation || '';
    const dist = chunk?.distance;

    let scoreHtml = '';
    if (dist !== undefined && dist !== null && !isNaN(Number(dist))) {
      const d   = Number(dist);
      const sim = d > 1 ? 1 / (1 + d) : Math.max(0, 1 - d);
      const pct = Math.round(sim * 100);
      scoreHtml = `<div class="frag-score">
        <span class="frag-score-val">${d.toFixed(3)}</span>
        <div class="frag-bar"><div class="frag-bar-fill" data-w="${pct}"></div></div>
      </div>`;
    }

    return `
    <div class="fragment glass" style="animation-delay:${i * 0.065}s">
      <div class="frag-header">
        <span class="frag-badge ${cls}">${esc(label)}</span>
        <span class="frag-meta">${esc(metaLine)}</span>
        <span class="frag-reg">${esc(reg)}</span>
        ${scoreHtml}
        <span class="frag-chevron">▶</span>
      </div>
      <div class="frag-body">
        <div class="frag-content">${esc(content)}</div>
      </div>
    </div>`;
  }

  /* ── Render result ── */
  function render(data) {
    const chunks = Array.isArray(data.retrieved_chunks) ? data.retrieved_chunks : [];

    let html = `
      <div class="answer-section">
        <p class="section-label">Response</p>
        <div class="answer-card glass">
          <div class="answer-text">${esc(data.answer)}</div>
        </div>
      </div>`;

    if (chunks.length) {
      html += `
        <div class="fragments-section">
          <p class="section-label">
            Retrieved fragments
            <span class="count">${chunks.length}</span>
          </p>
          <div class="fragments-grid">
            ${chunks.map(renderFragment).join('')}
          </div>
        </div>`;
    }

    outEl.innerHTML = html;

    outEl.querySelectorAll('.frag-header').forEach(h => {
      h.addEventListener('click', () => h.closest('.fragment').classList.toggle('open'));
    });

    requestAnimationFrame(() => {
      outEl.querySelectorAll('.frag-bar-fill').forEach(el => {
        el.style.width = (el.dataset.w || 0) + '%';
      });
    });

    stamp.textContent = `${chunks.length} fragments · ${new Date().toLocaleTimeString()}`;
  }

  function showError(title, body) {
    outEl.innerHTML = `<div class="error-card"><strong>${esc(title)}</strong>${esc(body)}</div>`;
    stamp.textContent = 'Error';
  }

  /* ── Submit ── */
  async function submit() {
    const question = qEl.value.trim();
    if (!question) { qEl.focus(); return; }
    const base = baseEl.value.trim().replace(/\/+$/, '');

    startLoader();
    const t0 = performance.now();

    try {
      const res = await fetch(`${base}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        let detail = `${res.status} ${res.statusText}`;
        try { const e = await res.json(); if (e?.detail) detail += ` — ${e.detail}`; } catch (_) {}
        throw Object.assign(new Error(detail), { http: true });
      }

      const data = await res.json();
      const elapsed = performance.now() - t0;
      if (elapsed < 500) await new Promise(r => setTimeout(r, 500 - elapsed));
      stopLoader();
      render(data);

    } catch (e) {
      stopLoader();
      const msg = e?.message ?? String(e);
      if (!e.http && /fetch|network|failed to/i.test(msg)) {
        showError('Node Unreachable',
          `No response from ${base}.\nEnsure uvicorn is running:\n  uv run uvicorn day_09.api.app:app --port 8080`);
      } else {
        showError('Request Failed', msg);
      }
    }
  }

  sendEl.addEventListener('click', submit);
  qEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
  });
  qEl.focus();
})();
</script>
</body>
</html>
